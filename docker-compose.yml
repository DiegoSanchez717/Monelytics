name: wealthpath
services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-wealthpath}
      POSTGRES_USER: ${DATABASE_USERNAME:-wealthpath}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-wealthpath}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-wealthpath}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      COOKIE_SECURE: 'false'
      DEMO_ENABLED: 'true'
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      API_DOCS_ENABLED: 'true'
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8081}:8080'
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health/readiness]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    restart: unless-stopped
    networks: [private, web]
  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
        # Reload Nginx's upstream DNS after Compose replaces the API container.
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [web]
volumes:
  postgres-data:
networks:
  private:
    internal: true
  web:
