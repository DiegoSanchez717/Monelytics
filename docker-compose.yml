name: monelytics
services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-monelytics}
      POSTGRES_USER: ${DATABASE_USERNAME:-monelytics}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Copy .env.example to .env and set DATABASE_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [private]
  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${DATABASE_NAME:-monelytics}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-monelytics}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?Set MFA_ENCRYPTION_KEY}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      MAIL_FROM: ${MAIL_FROM:-noreply@monelytics.local}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      # Blank keys select mock; only the backend's validated local-only opt-in can use Ollama.
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_LOCAL_URL: ${AI_LOCAL_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-llama3.2:3b}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '127.0.0.1:${BACKEND_PORT:-8081}:8080'
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health/readiness]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    restart: unless-stopped
    networks: [private, web]
  mailpit:
    image: axllent/mailpit:v1.31.4
    user: '1000:1000'
    environment:
      MP_MAX_MESSAGES: '200'
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit
      MP_DISABLE_VERSION_CHECK: 'true'
      MP_SMTP_RELAY_ALL: 'false'
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Capture only: no outbound SMTP relay or external email provider is configured.
    networks: [private, web]
  frontend:
    build:
      context: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
        # Reload Nginx's upstream DNS after Compose replaces the API container.
        restart: true
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [web]
volumes:
  postgres-data:
networks:
  private:
    internal: true
  web:
