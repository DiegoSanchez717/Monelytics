name: Validate and deploy Monelytics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the protected production environment (creates billed AWS resources)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monelytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: angular-production
          path: frontend/dist/monelytics/browser
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Docker on the runner is required: this profile executes real PostgreSQL tests.
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify -Ppostgres-it
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run synth -- --quiet
      - run: npm run audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: infrastructure-dependency-audit
          path: infrastructure/audit-report.json
          retention-days: 30
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
        working-directory: .

  container-security:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        run: docker build --tag monelytics-${{ matrix.component }}:ci ./${{ matrix.component }}
      - name: Scan operating system and application dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: monelytics-${{ matrix.component }}:ci
          version: 'v0.75.0'
          timeout: '20m'
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Configure isolated local demonstration
        run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 300
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7
      - name: Clean disposable CI containers
        if: always()
        run: docker compose down --volumes

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: [frontend, backend, infrastructure, container-security, end-to-end]
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: MonelyticsGitHubDeploy
      - run: npm ci --prefix infrastructure && npm ci --prefix frontend
      - name: Deploy tested infrastructure and Angular bundle
        run: node scripts/deploy-aws.mjs --deploy
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          API_ORIGIN_DOMAIN: ${{ vars.API_ORIGIN_DOMAIN }}
          ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}
          MFA_SECRET_ARN: ${{ vars.MFA_SECRET_ARN }}
          ORIGIN_HEADER_SECRET: ${{ secrets.ORIGIN_HEADER_SECRET }}
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          HOSTED_ZONE_NAME: ${{ vars.HOSTED_ZONE_NAME }}
          WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          WEB_CERTIFICATE_ARN: ${{ vars.WEB_CERTIFICATE_ARN }}
