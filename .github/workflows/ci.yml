name: Validate Monelytics

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monelytics-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  frontend:
    # Skip before runner allocation if the repository becomes private.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  backend:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      # Docker on the runner is required: this profile executes real PostgreSQL tests.
      - run: bash ./mvnw --batch-mode --no-transfer-progress verify -Ppostgres-it

  infrastructure:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run synth -- --quiet
      - run: npm run audit
      # Preserve the raw public dependency evidence in logs without artifact storage.
      - name: Print unmodified infrastructure dependency audit
        if: always()
        run: node -e "const fs = require('node:fs'); if (fs.existsSync('audit-report.json')) process.stdout.write(fs.readFileSync('audit-report.json', 'utf8'));"
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
        working-directory: .

  container-security:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image
        run: docker build --tag monelytics-${{ matrix.component }}:ci ./${{ matrix.component }}
      - name: Scan operating system and application dependencies
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: monelytics-${{ matrix.component }}:ci
          cache: 'false'
          version: 'v0.75.0'
          timeout: '20m'
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  end-to-end:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.12.0'
          package-manager-cache: false
      - name: Configure isolated local demonstration
        run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 300
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npm test
        working-directory: tests/e2e
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Clean disposable CI containers
        if: always()
        run: docker compose down --volumes
