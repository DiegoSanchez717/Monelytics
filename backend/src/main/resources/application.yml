spring:
  application:
    name: monelytics-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/monelytics}
    username: ${DATABASE_USERNAME:monelytics}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  web:
    error:
      include-message: never
      include-stacktrace: never
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MONELYTICS_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
logging:
  structured:
    format:
      console: logstash
monelytics:
  demo-enabled: ${DEMO_ENABLED:false}
  demo-password: ${DEMO_PASSWORD:Monelytics!2026}
  admin-password: ${ADMIN_PASSWORD:AdminDemo!2026}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  mail-from: ${MAIL_FROM:noreply@monelytics.local}
  ai:
    provider: ${AI_PROVIDER:mock}
    api-key: ${AI_API_KEY:}
    local-url: ${AI_LOCAL_URL:http://localhost:11434}
    model: ${AI_MODEL:llama3.2:3b}
  contribution-limit: ${CONTRIBUTION_LIMIT:7000}
  mfa-encryption-key: ${MFA_ENCRYPTION_KEY}
  cookie-secure: ${COOKIE_SECURE:false}
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
